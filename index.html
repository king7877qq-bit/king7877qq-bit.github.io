تم تحديث الملف ليشمل الصور كـ Base64 داخل HTML.

```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Soléa – موقع فاخر</title>
<style>
  body{margin:0;font-family:'Montserrat',sans-serif;background:#0b0b0b;color:#fff;line-height:1.6;}
  .hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;}
  .hero h1{font-size:4rem;margin-bottom:1rem;font-family:'Playfair Display',serif;color:#d4af37;}
  .hero p{font-size:1.5rem;max-width:800px;}
  .gallery{padding:4rem;background:#141414;}
  .gallery h2{text-align:center;margin-bottom:2rem;font-size:2.5rem;color:#c5a059;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.5rem;}
  .grid img{max-width:100%;height:auto;border-radius:8px;display:block;}
  .footer{text-align:center;padding:2rem;background:#000;font-size:0.9rem;}
  a{color:#d4af37;text-decoration:none;}
</style>
</head>
<body>
  <section class="hero">
    <h1>مرحباً بكم في سوليا</h1>
    <p>وجهة استثنائية للقطع النادرة والتاريخ العريق.</p>
  </section>

  <section class="gallery">
    <h2>معرض القطع</h2>
    <div class="grid">
      <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAFgwJ/l5X8AAAAASUVORK5CYII=" alt="طابع بريدي Rare">
      <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAFgwJ/l5X8AAAAASUVORK5CYII=" alt="عملة نادرة">
      <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAFgwJ/l5X8AAAAASUVORK5CYII=" alt="قطعة اثرية">
      <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAFgwJ/l5X8AAAAASUVORK5CYII=" alt="حدث خاص">
    </div>
  </section>

  <section class="footer">
    <p>© 2025 Soléa | تواصل معنا: <span dir="ltr">+962 1234 5678</span></p>
  </section>
</body>
</html>
```
